<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Agentic Trust Threshold</title>
    <meta name="description" content="Research manuscript: The Agentic Trust Threshold" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b1020;
        --card: #111933;
        --text: #e7ecff;
        --muted: #a8b3d6;
        --accent: #7aa2ff;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f5f8ff;
          --card: #ffffff;
          --text: #141b2d;
          --muted: #4f5f8f;
          --accent: #2f58cc;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at top, #1d2b59 0%, var(--bg) 40%);
        color: var(--text);
      }
      .wrap {
        max-width: 860px;
        margin: 0 auto;
        padding: 48px 20px 72px;
      }
      .card {
        background: var(--card);
        border: 1px solid rgba(122, 162, 255, 0.2);
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      }
      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.7rem, 2.4vw, 2.4rem);
        line-height: 1.15;
      }
      p { color: var(--muted); line-height: 1.7; }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 18px 0 26px;
      }
      .btn {
        text-decoration: none;
        color: white;
        background: var(--accent);
        padding: 10px 14px;
        border-radius: 10px;
        font-weight: 600;
      }
      .btn.secondary {
        color: var(--text);
        background: transparent;
        border: 1px solid rgba(122, 162, 255, 0.45);
      }
      img {
        width: 100%;
        border-radius: 12px;
        border: 1px solid rgba(122, 162, 255, 0.25);
      }
      .meta {
        margin-top: 18px;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <h1>The Agentic Trust Threshold</h1>
        <p>
          Research manuscript page for GitHub and GitHub Pages publication.

        <div class="links">

          <a class="btn secondary" href="../README.md">Project README</a>
          <a class="btn secondary" href="../CITATION.cff">Citation metadata</a>
        </div>

        <img src="assets/preview-web.jpg" alt="Preview image for The Agentic Trust Threshold manuscript" />

        <p class="meta">
          License: CC BY 4.0 • Last prepared: March 25, 2026
        </p>
      </section>
    </main>
  </body>
